name: beemview_mobile
description: "A Flutter mobile app for browsing projects and managing tasks."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  intl: ^0.20.3
  provider: ^6.1.5+1
  cupertino_icons: ^1.0.8
  flutter_launcher_icons: ^0.14.4
  connectivity_plus: ^7.3.2
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/beemview_logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
